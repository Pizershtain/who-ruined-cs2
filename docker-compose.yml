services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    environment:
      DATA_DIR: /data
      DATABASE_URL: file:/data/app.db
      MAX_UPLOAD_BYTES: ${MAX_UPLOAD_BYTES:-262144000}
      PUBLIC_MODE: "false"
      LOG_LEVEL: ${LOG_LEVEL:-info}
      ENABLE_EXPERIMENTAL_PARTICIPATION_RATING: ${ENABLE_EXPERIMENTAL_PARTICIPATION_RATING:-0}
      API_BIND_HOST: 0.0.0.0
    volumes:
      - ./data:/data
    ports:
      - "127.0.0.1:3000:3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/api/v1/health').then(r=>{if(!r.ok)process.exit(1)})"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    environment:
      DATA_DIR: /data
      DATABASE_URL: file:/data/app.db
      PARSE_TIMEOUT_MS: ${PARSE_TIMEOUT_MS:-120000}
      WORKER_POLL_MS: ${WORKER_POLL_MS:-1000}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      ENABLE_EXPERIMENTAL_PARTICIPATION_RATING: ${ENABLE_EXPERIMENTAL_PARTICIPATION_RATING:-0}
    volumes:
      - ./data:/data
    depends_on:
      api:
        condition: service_healthy
    mem_limit: 2g
    cpus: 2
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    environment:
      API_URL: http://api:3000
    ports:
      - "127.0.0.1:5173:5173"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
