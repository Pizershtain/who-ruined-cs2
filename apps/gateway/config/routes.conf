# Public API policy. Match the method and the normalized path, then forward
# exactly that path. The raw path check excludes ambiguous normalization.
map "$request_method:$uri" $api_upstream {
    default "";
    ~^(GET|HEAD|OPTIONS):/api/v1/(health|matches)/?$ api:3000;
    ~^(GET|HEAD|OPTIONS):/api/v1/jobs/[A-Za-z0-9:_-]+/?$ api:3000;
    ~^(GET|HEAD|DELETE|OPTIONS):/api/v1/matches/[A-Za-z0-9:_-]+/?$ api:3000;
    ~^(GET|HEAD|OPTIONS):/api/v1/matches/[A-Za-z0-9:_-]+/(analytics|rounds|experimental-participation-rating|experimental-participation-explanation|evp|radar|measured-stats|report|replay)/?$ api:3000;
    ~^(GET|HEAD|OPTIONS):/api/v1/matches/[A-Za-z0-9:_-]+/players/[A-Za-z0-9:_-]+/(analytics|report)/?$ api:3000;
    ~^(GET|HEAD|OPTIONS):/api/v1/matches/[A-Za-z0-9:_-]+/replay/rounds/[A-Za-z0-9:_-]+/?$ api:3000;
    ~^POST:/api/v1/matches(/[A-Za-z0-9:_-]+/rescore)?/?$ api:3000;
    ~^OPTIONS:/api/v1/matches/[A-Za-z0-9:_-]+/rescore/?$ api:3000;

    # Profiles is optional. Add future services here with explicit public routes.
    ~^(GET|HEAD|OPTIONS):/api/v1/players/[A-Za-z0-9:_-]+/profile(/matches)?/?$ profiles:3001;
    ~^POST:/api/v1/auth/(login|register|refresh|logout)/?$ auth:3002;
    ~^GET:/api/v1/auth/me/?$ auth:3002;
    ~^(GET|PUT|DELETE):/api/v1/auth/player-link/?$ auth:3002;
}

map $request_uri $canonical_api_path {
    default 0;
    # Clients percent-encode colons in opaque IDs. Query encoding is preserved.
    "~^/api(/([A-Za-z0-9:_-]|%3[aA])+)+/?(\?.*)?$" 1;
}

map $request_uri $starts_with_api {
    default 0;
    ~*^/api([/?]|$) 1;
}

map "$scheme://$http_host|$http_origin" $upstream_origin {
    default $http_origin;
    # Keep Core's CORS policy for cross-origin clients. An exact same-origin
    # request already passed the browser's origin check at this public origin.
    ~^([^|]+)\|\1$ "";
}

map $api_upstream $forward_origin {
    auth:3002 $http_origin;
    default $upstream_origin;
}

map $api_upstream $forward_cookie {
    auth:3002 $http_cookie;
    default "";
}

map $api_upstream $unavailable_code {
    auth:3002 AUTH_UNAVAILABLE;
    default UPSTREAM_UNAVAILABLE;
}

map $upstream_http_x_request_id $response_request_id {
    "" $request_id;
    default $upstream_http_x_request_id;
}

log_format edge escape=json
    '{"requestId":"$response_request_id","edgeRequestId":"$request_id","method":"$request_method",'
    '"status":$status,"duration":$request_time,"upstream":"$proxy_host","upstreamStatus":"$upstream_status",'
    '"upstreamDuration":"$upstream_response_time"}';

server {
    listen 8080 default_server;
    server_tokens off;
    access_log /dev/stdout edge;
    # Nginx error messages include complete client URLs. Use the structured
    # status/latency log for requests without exposing query parameters.
    error_log /dev/stderr crit;

    # Docker DNS with runtime lookup. Missing or recreated optional services
    # cannot prevent nginx from starting or keep an obsolete address indefinitely.
    resolver 127.0.0.11 valid=2s ipv6=off;
    resolver_timeout 3s;
    set $web_upstream web:5173;

    # Core accepts a configured demo limit of up to 2 GiB. Reserve 1 MiB
    # above that for multipart framing. These are idle I/O timeouts.
    client_max_body_size 2049m;
    client_header_timeout 15s;
    client_body_timeout 60s;
    large_client_header_buffers 4 72k;
    send_timeout 60s;
    proxy_connect_timeout 3s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;
    proxy_http_version 1.1;
    proxy_request_buffering off;
    proxy_buffering off;
    proxy_next_upstream off;
    proxy_intercept_errors off;
    proxy_ignore_headers X-Accel-Redirect X-Accel-Buffering;

    proxy_set_header Host $proxy_host;
    proxy_set_header Connection "";
    proxy_set_header Forwarded "";
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Port "";
    proxy_set_header X-Forwarded-Prefix "";
    proxy_set_header X-Original-URL "";
    proxy_set_header X-Rewrite-URL "";
    proxy_set_header X-Request-ID $request_id;
    proxy_set_header Origin $forward_origin;
    proxy_set_header Cookie $forward_cookie;
    proxy_hide_header X-Request-ID;
    add_header X-Request-ID $response_request_id always;

    default_type application/json;
    error_page 400 = @bad_request;
    error_page 404 = @not_found;
    error_page 408 = @client_timeout;
    error_page 413 = @size_limit;
    error_page 414 = @uri_limit;
    error_page 502 503 = @unavailable;
    error_page 504 = @upstream_timeout;

    location = /healthz {
        if ($request_method !~ "^(GET|HEAD)$") { return 404; }
        return 200 '{"status":"ok"}';
    }

    location ~ ^/api/v1/auth(/|$) {
        if ($canonical_api_path = 0) { return 404; }
        if ($api_upstream = "") { return 404; }
        client_max_body_size 4k;
        client_body_timeout 5s;
        proxy_read_timeout 10s;
        proxy_pass http://$api_upstream$uri$is_args$args;
    }

    location ~* ^/api(/|$) {
        if ($canonical_api_path = 0) { return 404; }
        if ($api_upstream = "") { return 404; }
        proxy_pass http://$api_upstream$uri$is_args$args;
    }


    location / {
        if ($starts_with_api) { return 404; }
        proxy_pass http://$web_upstream$request_uri;
    }

    location @bad_request {
        return 400 '{"error":{"code":"INVALID_REQUEST","message":"Invalid HTTP request."},"requestId":"$request_id"}';
    }
    location @not_found {
        return 404 '{"error":{"code":"NOT_FOUND","message":"Public route not found."},"requestId":"$request_id"}';
    }
    location @client_timeout {
        return 408 '{"error":{"code":"REQUEST_TIMEOUT","message":"Client request timed out."},"requestId":"$request_id"}';
    }
    location @size_limit {
        return 413 '{"error":{"code":"SIZE_LIMIT","message":"Request body exceeds the gateway limit."},"requestId":"$request_id"}';
    }
    location @uri_limit {
        return 414 '{"error":{"code":"REQUEST_URI_TOO_LONG","message":"Request URI exceeds the gateway limit."},"requestId":"$request_id"}';
    }
    location @unavailable {
        add_header X-Request-ID $response_request_id always;
        add_header Cache-Control "no-store" always;
        return 503 '{"error":{"code":"$unavailable_code","message":"Service is temporarily unavailable."},"requestId":"$request_id"}';
    }
    location @upstream_timeout {
        add_header X-Request-ID $response_request_id always;
        add_header Cache-Control "no-store" always;
        if ($api_upstream = "auth:3002") {
            return 503 '{"error":{"code":"AUTH_UNAVAILABLE","message":"Service is temporarily unavailable."},"requestId":"$request_id"}';
        }
        return 504 '{"error":{"code":"UPSTREAM_TIMEOUT","message":"Service did not respond in time."},"requestId":"$request_id"}';
    }
}
