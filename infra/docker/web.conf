server {
    listen 5173 default_server;
    server_tokens off;
    root /usr/share/nginx/html;

    location ~* ^/api(/|$) {
        return 404;
    }

    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }
}
